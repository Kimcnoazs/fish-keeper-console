name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest (arm64) has been stuck in the hosted-runner queue for
        # this repository; use the Intel macOS image so the macOS leg actually
        # runs instead of failing to acquire a runner.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        node: [24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        shell: bash
        run: |
          for file in lib/*.js; do node --check "$file"; done
      - name: Smoke tests
        run: npm test

  # The smoke scripts used to derive the repository path from
  # `new URL(...).pathname`, which percent-encodes non-ASCII characters. A path
  # with Chinese characters therefore failed on every platform except plain
  # ASCII checkouts, so run the full suite from one.
  chinese-path:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Copy repository to a path with Chinese characters
        shell: bash
        run: |
          target="${RUNNER_TEMP}/中文目录/测试"
          rm -rf "$target"
          mkdir -p "$target"
          cp -R . "$target"
      - name: Smoke tests from the Chinese path
        shell: bash
        working-directory: ${{ runner.temp }}/中文目录/测试
        run: npm test
